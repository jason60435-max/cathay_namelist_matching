<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅平險名冊轉換</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#1d2421;--mute:#68716c;--line:#d9ded9;--acc:#1f6f55;--accink:#fff;--bad:#fbe3e0;--badink:#9b2a1f;--ok:#e3f1ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--card:#1d2321;--ink:#e8ece9;--mute:#9aa49e;--line:#333c38;--acc:#4fb68f;--accink:#0d1411;--bad:#40201c;--badink:#ffb4a8;--ok:#1b3329}}
:root[data-theme="dark"]{--bg:#141816;--card:#1d2321;--ink:#e8ece9;--mute:#9aa49e;--line:#333c38;--acc:#4fb68f;--accink:#0d1411;--bad:#40201c;--badink:#ffb4a8;--ok:#1b3329}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--mute);font-size:.88rem;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:1rem;margin:0 0 10px}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 3px}
select,input[type=text],input[type=number]{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=file]{width:100%;font:inherit;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
button{font:inherit;font-weight:600;padding:12px 18px;border:0;border-radius:10px;background:var(--acc);color:var(--accink);width:100%;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:8px}
button:disabled{opacity:.4;cursor:not-allowed}
.sum{padding:10px 12px;border-radius:8px;background:var(--ok);margin-bottom:10px;font-size:.95rem}
.sum.bad{background:var(--bad);color:var(--badink)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.85rem;white-space:nowrap}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--bg);color:var(--mute);font-weight:600}
tr.bad td{background:var(--bad);color:var(--badink)}
.note{font-size:.82rem;color:var(--mute);margin-top:10px}
.note.warn{color:var(--badink)}
td.msg{white-space:normal;min-width:12em}
tr.edited td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.ops{display:flex;gap:6px}
button.mini{width:auto;padding:5px 10px;font-size:.8rem;border-radius:8px;background:transparent;color:var(--ink);border:1px solid var(--line)}
button.mini.del{color:var(--badink)}
.ovbar{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:.88rem}
.ovrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ovrow span{min-width:0}
button.chip{width:auto;margin:8px 8px 0 0;padding:6px 12px;font-size:.85rem;background:transparent;color:var(--ink);border:1px solid var(--line)}
.modal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(10,14,12,.55);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{width:100%;max-width:420px;max-height:100%;overflow:auto;margin:0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btns .alt{margin-top:0}
details summary{cursor:pointer;font-weight:600}
.dlink{display:block;margin-top:12px;padding:12px;border:1px dashed var(--acc);border-radius:10px;color:var(--acc);font-weight:600;text-align:center;word-break:break-all}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>旅平險名冊轉換</h1>
<p class="sub">檔案只在這個頁面的瀏覽器內處理，不會上傳。想確認的話，頁面載入後開啟飛航模式再操作。</p>

<section class="card">
<h2>1. 選擇老師的名冊（Excel）</h2>
<input type="file" id="file" accept=".xls,.xlsx,.csv">
<div id="shWrap" hidden><label for="sheetSel">工作表（檔案裡有多個工作表時，選名冊所在的那一個）</label><select id="sheetSel"></select></div>
<p class="note" id="fileinfo"></p>
</section>

<section class="card" id="mapCard" hidden>
<h2>2. 指定欄位</h2>
<label for="hRow">標題列（姓名、身分證那一列）在第幾列</label><input type="number" id="hRow" min="1" value="1">
<p class="note" id="hPrev"></p>
<label for="cName">姓名在哪一欄</label><select id="cName"></select>
<label for="cId">身分證字號在哪一欄</label><select id="cId"></select>
<label for="cBirth">出生日期在哪一欄（若年、月、日分成三欄，這裡選「年」那欄）</label><select id="cBirth"></select>
<div class="grid">
<div><label for="cBm">出生「月」在哪一欄（沒分欄就不選）</label><select id="cBm"></select></div>
<div><label for="cBd">出生「日」在哪一欄（沒分欄就不選）</label><select id="cBd"></select></div>
</div>
<p class="note" id="bNote"></p>
<details style="margin-top:14px"><summary>固定欄位（全員相同）</summary>
<div class="grid">
<div><label for="dType">ID類型</label><input type="number" id="dType" value="1"></div>
<div><label for="dSum">意外身故失能(萬)</label><input type="number" id="dSum" value="100"></div>
<div><label for="dReal">實支實付(萬)</label><input type="number" id="dReal" value="10"></div>
<div><label for="dInc">旅遊不便(Y/N)</label><input type="text" id="dInc" value="N"></div>
<div><label for="kSum">未滿15歲：身故失能＝喪葬(萬)</label><input type="number" id="kSum" value="69"></div>
<div><label for="kReal">未滿15歲：實支實付(萬)</label><input type="number" id="kReal" value="6"></div>
<div><label for="dBen">受益人(1法定/2指定)</label><input type="number" id="dBen" value="1"></div>
</div>
<p class="note">預設值取自國泰模板範例列，請依實際保單條件確認。未滿15歲者會自動改用兒童保額，喪葬費用同步填入。</p>
</details>
</section>

<section class="card" id="resCard" hidden>
<h2>3. 檢查結果</h2>
<div class="sum" id="sum"></div>
<div class="wrap"><table><thead><tr><th>操作</th><th>#</th><th>姓名</th><th>出生(民國)</th><th>身分證</th><th>需確認</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="ovbar" id="ovBar" hidden>
<div class="ovrow"><span id="ovTxt"></span><button type="button" class="mini" id="ovReset">全部還原</button></div>
<div id="chips"></div>
</div>
<div style="margin-top:14px"><button id="dl">下載國泰格式 (.xlsx)</button>
<button class="alt" id="cp">複製表格內容</button>
<a id="dlink" class="dlink" hidden></a></div>
<p class="note" id="msg"></p>
</section>
<p class="note" id="ver" style="text-align:center">版本 2026-10-15</p>
<div class="modal" id="ed" hidden role="dialog" aria-modal="true" aria-labelledby="edTitle">
<form class="card" id="edForm" autocomplete="off">
<h2 id="edTitle"></h2>
<label for="edName">姓名</label><input type="text" id="edName">
<label for="edBirth">出生日期</label><input type="text" id="edBirth" placeholder="例：950924、95/09/24、2006-09-24">
<label for="edId">身分證字號</label><input type="text" id="edId" autocapitalize="characters" spellcheck="false">
<p class="note" id="edPrev"></p>
<div class="btns"><button type="submit">儲存</button><button type="button" class="alt" id="edCancel">取消</button></div>
<button type="button" class="alt" id="edRevert" hidden>還原成原始檔內容</button>
</form>
</div>
</main>

<script id="core">
const L={A:10,B:11,C:12,D:13,E:14,F:15,G:16,H:17,I:34,J:18,K:19,L:20,M:21,N:22,O:35,P:23,Q:24,R:25,S:26,T:27,U:28,V:29,W:32,X:30,Y:31,Z:33};
function idOk(s){if(!/^[A-Z][12]\d{8}$/.test(s))return false;const c=L[s[0]];let t=Math.floor(c/10)+(c%10)*9;const w=[8,7,6,5,4,3,2,1,1];for(let i=0;i<9;i++)t+=(+s[i+1])*w[i];return t%10===0}
const p2=n=>String(n).padStart(2,'0');
const pn=x=>{if(x==null)return null;if(typeof x==='number')return Number.isFinite(x)?Math.trunc(x):null;const t=String(x).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).match(/\d+/);return t?+t[0]:null};
function bday(v,now){
  if(v===''||v==null)return{e:'缺出生日期'};
  let y,m,d;
  if(v&&v.ymd){
    const q=v.ymd.map(pn);
    if(q.every(x=>x==null))return{e:'缺出生日期'};
    if(q.some(x=>x==null))return{e:'出生年／月／日不完整'};
    if(q[0]>=1000)y=q[0]-1911;else if(q[0]>=1&&q[0]<=200)y=q[0];else return{e:'出生年份看不懂：'+v.ymd[0]};
    m=q[1];d=q[2];
  }
  else if(v instanceof Date){y=v.getFullYear()-1911;m=v.getMonth()+1;d=v.getDate()}
  else if(typeof v==='number'&&v<100000&&v>0){const o=XLSX.SSF.parse_date_code(v);y=o.y-1911;m=o.m;d=o.d}
  else{
    const s=String(v).trim().replace(/[年月\/\-．。]/g,'.').replace(/日/g,'').replace(/\s/g,'');
    if(/^\d+\.\d+\.\d+\.?$/.test(s)){[y,m,d]=s.split('.').map(Number);if(y>=1000)y-=1911}
    else if(/^\d{6,8}$/.test(s)){
      if(s.length===8){y=+s.slice(0,4)-1911;m=+s.slice(4,6);d=+s.slice(6)}
      else if(s.length===7){y=+s.slice(0,3);m=+s.slice(3,5);d=+s.slice(5)}
      else{y=+s.slice(0,2);m=+s.slice(2,4);d=+s.slice(4)}
    }else return{e:'生日格式看不懂：'+v};
  }
  const dt=new Date(y+1911,m-1,d);
  if(!(y>0)||dt.getMonth()!==m-1||dt.getDate()!==d)return{e:'生日不是有效日期'};
  if(dt>now)return{e:'生日在未來'};
  return{v:String(y).padStart(3,'0')+p2(m)+p2(d),dt};
}
const clean=x=>String(x??'').replace(/[\s\u3000]/g,'');
function evalRow(name,id,bv,hasB,now){
  const b=hasB?bday(bv,now):{e:'未選生日欄'};
  const bad=[];
  if(!name)bad.push('缺姓名');
  if(!id)bad.push('缺身分證');
  else if(!/^[A-Z][12]\d{8}$/.test(id))bad.push('身分證格式不符');
  else if(!idOk(id))bad.push('身分證檢查碼錯誤');
  let minor=false;
  if(b.e)bad.push(b.e);
  else{let a=now.getFullYear()-b.dt.getFullYear();const bd=new Date(now.getFullYear(),b.dt.getMonth(),b.dt.getDate());if(now<bd)a--;minor=a<15}
  return{name,id,birth:b.v||'',bad,minor};
}
// ov：以「原檔資料列序號」為鍵的手動調整，{del:true} 或 {name,id,birth}
function convert(rows,ix,def,now,ov){
  ov=ov||{};
  const out=[],seen={};
  rows.forEach((r,i)=>{
    const e=ov[i];
    if(e&&e.del)return;
    const name=e&&e.name!=null?clean(e.name):(ix.n<0?'':clean(r[ix.n]));
    const id=e&&e.id!=null?clean(e.id).toUpperCase():(ix.i<0?'':clean(r[ix.i]).toUpperCase());
    const ownB=!!(e&&e.birth!=null);
    const ymd=ix.b>=0&&ix.m>=0&&ix.d>=0;
    const o=evalRow(name,id,ownB?e.birth:(ix.b<0?undefined:(ymd?{ymd:[r[ix.b],r[ix.m],r[ix.d]]}:r[ix.b])),ownB||ix.b>=0,now);
    o.src=i;o.edited=!!(e&&(e.name!=null||e.id!=null||e.birth!=null));
    if(id)seen[id]=(seen[id]||0)+1;
    out.push(o);
  });
  out.forEach(o=>{if(o.id&&seen[o.id]>1)o.bad.push('身分證重複')});
  return out;
}
</script>
<script>
const $=id=>document.getElementById(id);
let rows=[],res=[],dl=null,ov={};
(async()=>{try{if(window.claude&&claude.use)dl=await claude.use('downloads')}catch(e){}})();
const HEAD=["編號","姓名","出生日期(民國7碼)","ID類型","ID號碼","國籍＆居住地","性別","意外身故失能(萬)","喪葬費用(萬)","特定事故(萬)","恐怖主義(萬)","實支實付(萬)","突發疾病(萬)","旅遊不便","不便方案","受益人","受益人姓名","與被保人關係","英文姓名","護照號碼"];
let aoa=[];
function build(hi){
  const had=Object.keys(ov).length;ov={};if(had)$('msg').textContent='標題列或工作表已變更，先前手動刪除與修改的內容已清除。';
  const hdr=(aoa[hi]||[]).map(x=>String(x).trim());
  rows=aoa.slice(hi+1).filter(r=>r.some(c=>String(c).trim()!==''));
  const sn=$('sheetSel').value;$('fileinfo').textContent=`已讀取：${rows.length} 筆資料（工作表：${sn}）`;
  $('hPrev').textContent='目前標題列內容：'+(hdr.filter(Boolean).join('、')||'（這一列是空的）');
  const opts=hdr.map((h,i)=>`<option value="${i}">${(h||'（無標題）').replace(/</g,'&lt;')}（第${i+1}欄）</option>`).join('');
  const g={cName:guess(hdr,/姓名|名字|被保|^名/),cId:guess(hdr,/身分證|身份證|證號|字號|ID/i),cBirth:guess(hdr,/生日|出生|生年/),cBm:-1,cBd:-1};
  const gy=hdr.findIndex(x=>/年/.test(x)&&!/齡|歲/.test(x)&&/生|出|^年$|民國|西元/.test(x)||/^(民國|西元)?年$/.test(x));
  const gm=hdr.findIndex(x=>/月/.test(x)),gd=hdr.findIndex((x,i)=>/日/.test(x)&&!/日期/.test(x)&&i!==gy&&i!==gm);
  if(gy>=0&&gm>=0&&gd>=0){g.cBirth=gy;g.cBm=gm;g.cBd=gd}
  for(const k in g){$(k).innerHTML='<option value="-1">（不選）</option>'+opts;$(k).value=g[k];$(k).onchange=run}
  $('mapCard').hidden=false;run();
}
function guess(h,re){const i=h.findIndex(x=>re.test(x));return i}
let wbk=null;
function loadSheet(name){
  aoa=XLSX.utils.sheet_to_json(wbk.Sheets[name],{header:1,raw:true,defval:''});
  let hi=0;const re=[/姓名|名字|被保/,/身分證|身份證|證號|字號|ID/i,/生日|出生|生年/];
  for(let r=0;r<Math.min(aoa.length,30);r++){const t=aoa[r].map(x=>String(x));if(re.filter(q=>t.some(c=>q.test(c))).length>=2){hi=r;break}}
  $('hRow').value=hi+1;$('hRow').oninput=()=>build(Math.max(0,(+$('hRow').value||1)-1));
  ['dType','dSum','dReal','dInc','dBen','kSum','kReal'].forEach(k=>$(k).oninput=run);
  build(hi);
}
$('sheetSel').onchange=()=>{if(wbk)loadSheet($('sheetSel').value)};
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    wbk=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
    $('sheetSel').innerHTML=wbk.SheetNames.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
    $('shWrap').hidden=false;
    ov={};loadSheet(wbk.SheetNames[0]);
  }catch(err){wbk=null;$('shWrap').hidden=true;$('fileinfo').textContent='讀取失敗，請確認是 Excel 檔（.xls/.xlsx）。';$('mapCard').hidden=true;$('resCard').hidden=true}
};
function def(){return{type:$('dType').value,sum:$('dSum').value,real:$('dReal').value,inc:$('dInc').value.trim().toUpperCase(),ben:$('dBen').value,ksum:$('kSum').value,kreal:$('kReal').value}}
function ixs(){return{n:+$('cName').value,i:+$('cId').value,b:+$('cBirth').value,m:+$('cBm').value,d:+$('cBd').value}}
function rawBirth(i){const x=ixs();if(x.b<0)return'';const r=rows[i];return(x.m>=0&&x.d>=0)?[r[x.b],r[x.m],r[x.d]].map(v=>String(v??'').trim()||'?').join('/'):(r[x.b] instanceof Date?'':String(r[x.b]??''))}
function rawName(i){const x=ixs();return x.n<0?'':clean(rows[i][x.n])}
function run(){
  const xx=ixs(),bn=$('bNote');
  bn.className='note';
  if(xx.b>=0&&xx.m>=0&&xx.d>=0)bn.textContent='已改用「年＋月＋日」三欄組合。年份可是西元（如 1996）或民國（如 85）；3 位數以下視為民國，4 位數視為西元。';
  else if(xx.m>=0||xx.d>=0){bn.className='note warn';bn.textContent='月與日兩欄都要選，才會使用三欄組合；目前仍以單一生日欄判斷。'}
  else bn.textContent='';
  res=convert(rows,ixs(),def(),new Date(),ov);
  const nb=res.filter(o=>o.bad.length).length;
  const ne=res.filter(o=>o.edited).length;
  const dels=Object.keys(ov).filter(i=>ov[i].del).map(Number).sort((a,b)=>a-b);
  const s=$('sum');s.className='sum'+(nb||!res.length?' bad':'');
  s.textContent=!res.length?'目前沒有任何人員。請復原已刪除的人員，或重新選擇檔案。'
    :nb?`共 ${res.length} 人，其中 ${nb} 人需確認（紅色列）。可按「編輯」直接修正，或「刪除」該列。`
    :`共 ${res.length} 人，全部通過檢查。`;
  $('tb').innerHTML=res.map((o,k)=>{
    const parts=[];
    if(o.bad.length)parts.push(o.bad.join('；'));else if(o.minor)parts.push('未滿15歲：已套用兒童保額');
    if(o.edited)parts.push('已修改');
    const nm=esc(o.name||'（空白）');
    return `<tr class="${o.bad.length?'bad':''}${o.edited?' edited':''}"><td><div class="ops"><button type="button" class="mini" data-act="edit" data-i="${o.src}" aria-label="編輯 ${nm}">編輯</button><button type="button" class="mini del" data-act="del" data-i="${o.src}" aria-label="刪除 ${nm}">刪除</button></div></td><td>${k+1}</td><td>${esc(o.name)}</td><td>${o.birth}</td><td>${esc(o.id)}</td><td class="msg">${esc(parts.join('｜'))}</td></tr>`;
  }).join('');
  $('ovBar').hidden=!(dels.length||ne);
  $('ovTxt').textContent=`手動調整：已刪除 ${dels.length} 人、修改 ${ne} 人。下載與複製會使用調整後的內容。`;
  $('chips').innerHTML=dels.map(i=>{
    const n=(ov[i].name!=null?clean(ov[i].name):rawName(i))||('第'+(i+1)+'筆');
    return `<button type="button" class="chip" data-act="undo" data-i="${i}">復原 ${esc(n)}</button>`;
  }).join('');
  $('dl').disabled=$('cp').disabled=!res.length;
  $('resCard').hidden=false;
}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function table(){
  const d=def();
  return [HEAD].concat(res.map((o,i)=>[i+1,o.name,o.birth,+d.type||'',o.id,'',o.id[1]==='1'?'M':o.id[1]==='2'?'F':'',(o.minor?+d.ksum:+d.sum)||'',o.minor?+d.ksum||'':'','','',(o.minor?+d.kreal:+d.real)||'','',d.inc,'',+d.ben||'','','','','']));
}
const MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
let lastUrl=null;
$('dl').onclick=async()=>{
  const m=$('msg'),lk=$('dlink');lk.hidden=true;m.textContent='';
  if(typeof XLSX==='undefined'){m.textContent='Excel 程式庫沒有載入成功（可能沒有網路或被擋住），請重新整理頁面後再試。';return}
  try{
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(table()),'名冊');
    const t=new Date(),stamp=t.getFullYear()+p2(t.getMonth()+1)+p2(t.getDate());
    const name=`國泰名冊_${stamp}.xlsx`,buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
    if(dl){await dl.save({filename:name,data:buf});m.textContent='已送出下載。上傳前請先看紅色列是否已處理。';return}
    const blob=new Blob([buf],{type:MIME});
    if(lastUrl)URL.revokeObjectURL(lastUrl);
    lastUrl=URL.createObjectURL(blob);
    lk.href=lastUrl;lk.download=name;lk.textContent='若沒有開始下載，請點這裡：'+name;lk.hidden=false;
    // 手機：優先用系統分享選單（可選「儲存到檔案」），最可靠
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.share){
      try{
        const file=new File([blob],name,{type:MIME});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:name});
          m.textContent='已開啟分享選單，請選「儲存到檔案」或直接傳到想要的位置。';return;
        }
      }catch(e){if(e&&e.name==='AbortError'){m.textContent='已取消。需要時可點下方連結再下載。';return}}
    }
    lk.click();
    m.textContent='已產生檔案。如果沒有看到下載，請點下方虛線框的連結（手機可長按連結選「下載連結」）。';
  }catch(e){m.textContent='下載失敗：'+(e&&e.message?e.message:e)+'。請改用「複製表格內容」。'}
};
$('cp').onclick=async()=>{
  const tsv=table().map(r=>r.join('\t')).join('\n');
  try{await navigator.clipboard.writeText(tsv);$('msg').textContent='已複製，可貼到 Excel 或國泰模板。'}
  catch(e){$('msg').textContent='無法自動複製，請手動長按表格選取。'}
};

// ---- 刪除 / 復原 / 編輯 ----
$('resCard').addEventListener('click',ev=>{
  const b=ev.target.closest('button[data-act]');if(!b)return;
  const i=+b.dataset.i,act=b.dataset.act;
  if(act==='del'){ov[i]=Object.assign(ov[i]||{},{del:true});run()}
  else if(act==='undo'){if(ov[i]){delete ov[i].del;if(!Object.keys(ov[i]).length)delete ov[i]}run()}
  else if(act==='edit')openEdit(i,b);
});
$('ovReset').onclick=()=>{ov={};run()};
let editing=null,opener=null,prefill={};
function edPrev(){
  const r=evalRow(clean($('edName').value),clean($('edId').value).toUpperCase(),$('edBirth').value,true,new Date());
  const p=$('edPrev');p.className='note'+(r.bad.length?' warn':'');
  p.textContent=r.bad.length?'目前輸入：'+r.bad.join('；'):'檢查通過。出生日期會輸出為 '+r.birth+(r.minor?'，未滿15歲，將套用兒童保額。':'。');
}
function openEdit(i,btn){
  const o=res.find(r=>r.src===i);if(!o)return;
  
  editing=i;opener=btn;
  prefill={name:o.name,birth:o.birth||rawBirth(i),id:o.id};
  $('edTitle').textContent='修改第 '+(res.indexOf(o)+1)+' 位';
  $('edName').value=prefill.name;$('edBirth').value=prefill.birth;$('edId').value=prefill.id;
  $('edRevert').hidden=!ov[i];
  edPrev();$('ed').hidden=false;$('edName').focus();
}
function closeEdit(){$('ed').hidden=true;editing=null;opener=null}
['edName','edBirth','edId'].forEach(k=>$(k).oninput=edPrev);
$('edForm').addEventListener('submit',ev=>{
  ev.preventDefault();if(editing==null)return;
  const ch={},n=$('edName').value,b=$('edBirth').value.trim(),d=$('edId').value;
  if(clean(n)!==prefill.name)ch.name=n;
  if(b!==prefill.birth)ch.birth=b;
  if(clean(d).toUpperCase()!==prefill.id)ch.id=d;
  if(Object.keys(ch).length)ov[editing]=Object.assign(ov[editing]||{},ch);
  closeEdit();run();
});
$('edCancel').onclick=closeEdit;
$('edRevert').onclick=()=>{if(editing!=null)delete ov[editing];closeEdit();run()};
$('ed').addEventListener('click',ev=>{if(ev.target===$('ed'))closeEdit()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('ed').hidden)closeEdit()});
</script>
